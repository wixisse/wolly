    <path fill="url(#sheen)"
          d="M42.5 1.88608e-05H197.5C203.083 -0.00524284 208.612 1.09046 213.77 3.22442C218.929 5.35838 223.616 8.48871 227.564 12.4362C231.511 16.3838 234.642 21.071 236.776 26.2297C238.91 31.3885 240.005 36.9174 240 42.5V191.5C240.005 197.083 238.91 202.612 236.776 207.77C234.642 212.929 231.511 217.616 227.564 221.564C223.616 225.511 218.929 228.642 213.77 230.776C208.612 232.91 203.083 234.005 197.5 234H42.5C36.9174 234.005 31.3885 232.91 26.2297 230.776C21.071 228.642 16.3838 225.511 12.4362 221.564C8.48871 217.616 5.35838 212.929 3.22442 207.77C1.09046 202.612 -0.00524284 197.083 1.88608e-05 191.5V42.5C-0.00524284 36.9174 1.09046 31.3885 3.22442 26.2297C5.35838 21.071 8.48871 16.3838 12.4362 12.4362C16.3838 8.48871 21.071 5.35838 26.2297 3.22442C31.3885 1.09046 36.9174 -0.00524284 42.5 1.88608e-05Z"/>
    <path fill="url(#vignette)"
          d="M42.5 1.88608e-05H197.5C203.083 -0.00524284 208.612 1.09046 213.77 3.22442C218.929 5.35838 223.616 8.48871 227.564 12.4362C231.511 16.3838 234.642 21.071 236.776 26.2297C238.91 31.3885 240.005 36.9174 240 42.5V191.5C240.005 197.083 238.91 202.612 236.776 207.77C234.642 212.929 231.511 217.616 227.564 221.564C223.616 225.511 218.929 228.642 213.77 230.776C208.612 232.91 203.083 234.005 197.5 234H42.5C36.9174 234.005 31.3885 232.91 26.2297 230.776C21.071 228.642 16.3838 225.511 12.4362 221.564C8.48871 217.616 5.35838 212.929 3.22442 207.77C1.09046 202.612 -0.00524284 197.083 1.88608e-05 191.5V42.5C-0.00524284 36.9174 1.09046 31.3885 3.22442 26.2297C5.35838 21.071 8.48871 16.3838 12.4362 12.4362C16.3838 8.48871 21.071 5.35838 26.2297 3.22442C31.3885 1.09046 36.9174 -0.00524284 42.5 1.88608e-05Z"/>
  </g>

