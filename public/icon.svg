<?xml version="1.0" encoding="UTF-8"?>
<!--
  Wolly app icon — master SVG source
  Adapted from the Adobe Dreamweaver "Dw" icon shape.
  Same rounded-square silhouette + "W" glyph, re-skinned to Wolly's
  deep-violet palette with a fuchsia/pink W mark.

  Render size: 240 × 240 (background path is 240 × 234, centred via translate(0,3))
  To generate PNG / ICO / ICNS run: npm run icons:generate
-->
<svg width="512" height="512" viewBox="0 0 240 240" fill="none"
     xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- ── Background: deep Wolly violet ──────────────────────────────── -->
    <linearGradient id="bg" x1="0" y1="0" x2="240" y2="240"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#230950"/>
      <stop offset="100%" stop-color="#0f0228"/>
    </linearGradient>

    <!-- Soft violet bloom -->
    <radialGradient id="bloom" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- ── W letter gradient ───────────────────────────────────────────── -->
    <!-- Coordinates in outer SVG userSpace after translate(65, 80)        -->
    <linearGradient id="wgrad" x1="65" y1="80" x2="65" y2="160"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF61F6"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>

    <!-- W fuchsia glow filter -->
    <filter id="wglow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#e879f9" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Top-edge sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom vignette -->
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="60%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>

  </defs>

  <!-- ══ Background rounded-square ══════════════════════════════════════
       Original path is 240 × 234; shift ↓3 px to centre in 240 × 240   -->
